<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Terminal tests</title>
    <style>
        body { font: 14px/1.5 monospace; background: #111; color: #ddd; margin: 16px; }

        .fail { color: #f66; }
        #summary { white-space: pre-wrap; }

<body>

    <script src="harness.js"></script>
    <script src="tests.js"></script>
    <script>runTests();</script>
